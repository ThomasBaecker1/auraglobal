name: Initial Awin Blob sync v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/initial-awin-blob-sync-v2.yml"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger real Vercel production sync
        run: |
          response="$(curl --fail --show-error --silent --max-time 320 "https://auraglobal.vercel.app/api/sync-awin?once=ag_init_20261005_v2_T7mQ4x9P")"
          echo "$response"
          echo "$response" | grep -q '"ok":true'
