name: AuraGlobal | Notify updated pages to IndexNow
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'sitemap.xml'
      - 'scripts/indexnow-submit.mjs'
      - '.github/workflows/indexnow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Notify IndexNow of changed indexable pages
        env:
          BEFORE_SHA: ${{ github.event.before }}
          INDEXNOW_BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && '1' || contains(github.event.head_commit.message, 'Enable wider IndexNow') && '1' || '0' }}
        run: node scripts/indexnow-submit.mjs
