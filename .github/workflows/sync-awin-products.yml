name: Sync Awin products

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-awin-products.yml"
      - "scripts/sync-awin-feeds.mjs"
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: awin-product-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync Awin product feeds
        env:
          AWIN_DATAFEED_API_KEY: ${{ secrets.AWIN_DATAFEED_API_KEY }}
          AWIN_PUBLISHER_ID: "3076553"
        run: node scripts/sync-awin-feeds.mjs

      - name: Commit changed catalog
        run: |
          if [ -z "$(git status --porcelain -- data/products.json data/catalog)" ]; then
            echo "No product changes."
            exit 0
          fi
          git config user.name "auraglobal-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/products.json data/catalog
          git commit -m "Update complete Awin product catalog"
          git push
