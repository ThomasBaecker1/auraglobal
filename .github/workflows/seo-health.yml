name: AuraGlobal SEO health
on:
  push:
    branches: [main]
    paths: ["*.html", "sitemap.xml", "robots.txt", "scripts/seo-audit.mjs", ".github/workflows/seo-health.yml"]
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate sitemap and SEO markup
        run: node scripts/seo-audit.mjs
