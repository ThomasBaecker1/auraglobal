name: AuraGlobal affiliate integrity
on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "assets/aura-match*.js"
      - "assets/aura-match*.css"
      - "sitemap.xml"
      - "scripts/audit-affiliates.mjs"
      - ".github/workflows/affiliate-integrity.yml"
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Awin publisher links and buyer journeys
        run: node scripts/audit-affiliates.mjs
