name: Initial Awin Blob sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/initial-awin-blob-sync.yml"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trigger protected production sync
        run: |
          curl --fail --show-error --silent --max-time 320 \
            "https://auraglobal.net/api/sync-awin?once=ag_once_6Qm2vN8Lr4Zx7Pj1Hs9Tf3Wk5Cy0BdUa"
